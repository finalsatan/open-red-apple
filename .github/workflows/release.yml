# 推送 v* 标签时交叉编译 Windows 版本，打包成 zip 和 NSIS 安装包，
# 附上校验和，并创建 GitHub Release。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 要构建并附加到的标签，例如 v0.1.0
        required: true

permissions:
  contents: write

env:
  WAILS_VERSION: v2.17.1
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis

      - name: Build (windows/amd64 + installer)
        run: wails build -platform windows/amd64 -nsis -clean

      - name: Package
        run: |
          set -eu
          base="open-red-apple_${TAG}_windows_amd64"
          mkdir -p "pkg/$base" dist
          cp build/bin/win-red-apple.exe "pkg/$base/"
          cp README.md "pkg/$base/"
          (cd pkg && zip -qr "../dist/${base}.zip" "$base")
          cp build/bin/win-red-apple-amd64-installer.exe "dist/${base}_installer.exe"
          (cd dist && sha256sum ./* > "${base}_checksums.txt")
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
