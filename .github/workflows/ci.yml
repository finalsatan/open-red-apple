# 每次 push 到 main、PR 和手动触发时：检查 Go 代码并交叉编译 Windows 版本。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.17.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./internal/...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION

      - name: Build (windows/amd64)
        run: wails build -platform windows/amd64 -clean

      - uses: actions/upload-artifact@v7
        with:
          name: win-red-apple-windows-amd64
          path: build/bin/win-red-apple.exe
          if-no-files-found: error
