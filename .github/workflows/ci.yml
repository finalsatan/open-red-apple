# 每次 push 到 main、PR 和手动触发时：检查 Go 代码并交叉编译 Windows 版本。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v2.17.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...

      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          npx playwright install --with-deps chromium

      - name: Test playback in Chromium
        working-directory: frontend
        run: npm run test:e2e

      - name: Test WebView2 smoke driver with local Chromium
        working-directory: frontend
        run: node tests/run-webview2-smoke.mjs --simulate

      - name: Test media remux
        run: go test ./internal/gateway

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$WAILS_VERSION

      - name: Build (windows/amd64)
        run: wails build -platform windows/amd64 -clean

      - uses: actions/upload-artifact@v7
        with:
          name: win-red-apple-windows-amd64
          path: build/bin/win-red-apple.exe
          if-no-files-found: error

  windows-tests:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend on Windows
        run: go test -short ./...

      - name: Install FFmpeg
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:ChocolateyInstall\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Test media remux on Windows
        shell: pwsh
        run: |
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v ./internal/gateway

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium

      - name: Test playback in Chromium on Windows
        working-directory: frontend
        run: npm run test:e2e
